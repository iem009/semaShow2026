<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HydraBOND SEMA 2026 Lead Capture</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BHG Leads">

    <!-- HTML5-QRCode Scanner Library CDN -->
    <script src="https://unpkg.com"></script>
    
    <style>
        :root {
            --bg-color: #0d0f14;
            --panel-bg: #161920;
            --border-color: #272b35;
            --accent-color: #00d2ff;
            --text-main: #f4f4f7;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
        }

        header p {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
            margin-top: 4px;
        }

        main {
            flex: 1;
            padding: 16px;
            max-width: 440px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 110px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.08);
        }

        .counter-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .counter-value {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 2px;
        }

        .btn-secondary {
            background-color: #272b35;
            color: #ffffff;
            border: 1px solid #4b5563;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 12px;
        }

        #reader {
            background-color: #000000;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .camera-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #scannerFeedback {
            font-size: 11px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        input#formBarcode {
            color: var(--accent-color);
            font-family: monospace;
            font-weight: bold;
        }

        .btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: #0d0f14;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 210, 255, 0.2);
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            z-index: 100;
        }

        .footer-link {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .footer-link:active {
            color: #ffffff;
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>BHG IMPORT EXPORT INC</h1>
        <p>hydrabond.com • SEMA Show 2026</p>
    </header>

    <main>
        <!-- Counter Status -->
        <div class="panel counter-row">
            <div>
                <div class="counter-label">Leads Saved</div>
                <div id="leadCount" class="counter-value">0</div>
            </div>
            <button type="button" onclick="exportToCSV()" class="btn-secondary">📥 Export CSV</button>
        </div>

        <!-- Camera Section with Manual Permission Request Fix -->
        <div class="panel">
            <div class="panel-title">📷 Badge Scanner</div>
            <div id="reader">
                <div class="camera-controls" id="initControls">
                    <button type="button" onclick="requestDeviceCamera()" class="btn-primary" style="margin-top:0;">
                        🔓 Activate Booth Camera
                    </button>
                </div>
            </div>
            <div id="scannerFeedback">Camera tracking offline. Tap button to launch hardware.</div>
        </div>

        <!-- Submission Form Layout -->
        <form id="leadForm" class="panel" onsubmit="saveLead(event)">
            <div class="panel-title" style="color: #ffffff;">Shop / Distributor Info</div>
            
            <div class="form-group">
                <label>Scanned Badge ID / Barcode</label>
                <input type="text" id="formBarcode" placeholder="Scan barcode or type manually">
            </div>

            <div class="form-row form-group">
                <div>
                    <label>Full Name *</label>
                    <input type="text" id="formName" required>
                </div>
                <div>
                    <label>Company *</label>
                    <input type="text" id="formCompany" required>
                </div>
            </div>

            <div class="form-row form-group">
                <div>
                    <label>Email Address</label>
                    <input type="email" id="formEmail">
                </div>
                <div>
                    <label>Phone Number</label>
                    <input type="tel" id="formPhone">
                </div>
            </div>

            <div class="form-group">
                <label>Interest Level</label>
                <select id="formInterest">
                    <option value="Hot 🔥">Hot 🔥 (Ready to buy)</option>
                    <option value="Medium ⚡">Medium ⚡ (Interested)</option>
                    <option value="Cold ❄️">Cold ❄️ (General inquiry)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Booth Notes</label>
                <textarea id="formNotes" rows="3" placeholder="Note mix requests, volume pricing inquiries, etc..."></textarea>
            </div>
