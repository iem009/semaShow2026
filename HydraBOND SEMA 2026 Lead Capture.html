<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>HydraBOND SEMA 2026 Lead Capture</title>
    
    <!-- Apple / iOS Standalone Web App Meta Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BHG Leads">

    <style>
        body { 
            background-color: #0D0E12; 
            color: #E4E4E7; 
            /* Stops mobile drag-to-refresh swipe down gestures from resetting the code interface */
            overscroll-behavior-y: contain; 
            -webkit-overflow-scrolling: touch;
        }

<body class="font-sans antialiased min-h-screen flex flex-col selection:bg-[#00D2FF] selection:text-[#0D0E12]">

    <!-- Fixed Core Mobile Responsive App Header Bar -->
    <header class="glass-panel border-t-0 border-x-0 p-4 text-center sticky top-0 z-50 shadow-md">
        <h1 class="text-base font-black tracking-wider text-white">BHG IMPORT EXPORT INC</h1>
        <p class="text-[10px] font-bold tracking-widest text-[#00D2FF] uppercase mt-0.5">hydrabond.com • SEMA 2026</p>
    </header>

    <!-- Main Container Layout: Scaled first for mobile phone frames and tablets -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full space-y-4 pb-28">
        
        <!-- Local Metrics Counter Block -->
        <div class="glass-panel rounded-xl p-4 flex justify-between items-center accent-glow">
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Leads Collected</p>
                <p id="leadCount" class="text-3xl font-black text-white">0</p>
            </div>
            <button onclick="exportToCSV()" class="bg-[#272B35] hover:bg-[#333845] border border-gray-600 text-white px-3.5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2 active:scale-95 cursor-pointer">
                📥 Export CSV
            </button>
        </div>

        <!-- Hardware Camera Streaming Dashboard Layer -->
        <div class="glass-panel rounded-xl p-4 space-y-3">
            <h2 class="text-xs font-bold tracking-wider uppercase text-[#00D2FF] flex items-center gap-2">
                📷 Badge Scanner
            </h2>
            <div id="reader" class="bg-black rounded-lg border border-[#272B35] overflow-hidden"></div>
            <div id="scannerFeedback" class="text-[11px] text-center text-gray-400 italic">Initializing phone camera matrix...</div>
        </div>

        <!-- Lead Capture Collection Target Form Structure -->
        <form id="leadForm" class="glass-panel rounded-xl p-4 space-y-3" onsubmit="saveLead(event)">
            <h2 class="text-xs font-bold tracking-wider uppercase text-gray-300">Shop / Distributor Info</h2>
            
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Scanned Badge Data</label>
                <input type="text" id="formBarcode" class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-xs text-[#00D2FF] font-mono focus:outline-none focus:border-[#00D2FF]" placeholder="Scan barcode or type manually">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Full Name *</label>
                    <input type="text" id="formName" required class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#00D2FF]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Company *</label>
                    <input type="text" id="formCompany" required class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#00D2FF]">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Email Addr</label>
                    <input type="email" id="formEmail" class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#00D2FF]">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Phone Num</label>
                    <input type="tel" id="formPhone" class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-[#00D2FF]">
                </div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Interest Level</label>
                <select id="formInterest" class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00D2FF] font-semibold">
                    <option value="Hot 🔥">Hot 🔥 (Ready to buy)</option>
                    <option value="Medium ⚡">Medium ⚡ (Interested)</option>
                    <option value="Cold ❄️">Cold ❄️ (General inquiry)</option>
                </select>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1">Booth Notes</label>
                <textarea id="formNotes" rows="3" class="w-full bg-[#0D0E12] border border-[#272B35] rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-[#00D2FF]" placeholder="Note mix requests, volume pricing inquiries, etc..."></textarea>
            </div>

            <button type="submit" class="w-full bg-[#00D2FF] hover:bg-[#00b4dc] text-[#0D0E12] font-black py-3 rounded-lg text-xs tracking-widest uppercase transition mt-2 shadow-lg shadow-[#00d2ff2b] active:scale-[0.99] cursor-pointer">
                Save Record
            </button>
        </form>
    </main>

    <!-- Quick Navigation Links (Live Dashboard Subdomain Redirects) -->
    <footer class="fixed bottom-0 left-0 right-0 glass-panel border-b-0 border-x-0 p-3 grid grid-cols-3 gap-2 text-center text-[10px] font-black uppercase tracking-wider">
        <a href="https://hydrabond.com" target="_blank" class="py-2.5 bg-[#0D0E12] rounded-lg border border-[#272B35] text-gray-300 hover:text-white hover:border-[#00D2FF] transition flex flex-col justify-center items-center gap-0.5">
            <span>🪄</span> <span>Advisor</span>
        </a>
        <a href="https://hydrabond.com" target="_blank" class="py-2.5 bg-[#0D0E12] rounded-lg border border-[#272B35] text-gray-300 hover:text-white hover:border-[#00D2FF] transition flex flex-col justify-center items-center gap-0.5">
            <span>📦</span> <span>Wizard</span>
        </a>
        <a href="https://hydrabond.com" target="_blank" class="py-2.5 bg-[#0D0E12] rounded-lg border border-[#272B35] text-gray-300 hover:text-white hover:border-[#00D2FF] transition flex flex-col justify-center items-center gap-0.5">
            <span>📊</span> <span>VOC Charts</span>
        </a>
    </footer>

    <!-- Core Pipeline JavaScript Engine Logic Block -->
    <script>
        // Optional Configuration Target: Paste Google Web App Deployment URL string link inside empty quotes if streaming data directly to Google sheets
        const GOOGLE_SCRIPT_URL = "";
        let leads = JSON.parse(localStorage.getItem('sema_leads_2026')) || [];

        function updateCounter() {
            document.getElementById('leadCount').innerText = leads.length;
        }

        // Processing hardware scanner inputs instantly
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('formBarcode').value = decodedText;
            document.getElementById('scannerFeedback').innerText = "Last scanned token: " + decodedText;
            
            // Calls device mobile physical haptic response tracking engine on success match
            if (navigator.vibrate) {
                navigator.vibrate(120);
            }
        }

        // Fire up browser native mobile camera viewfinder stream logic variables
        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 15, 
            qrbox: { width: 250, height: 150 },
            rememberLastUsedCamera: true,
            aspectRatio: 1.0
        });
        html5QrcodeScanner.render(onScanSuccess);
        
        setTimeout(() => {
            document.getElementById('scannerFeedback').innerText = "System configuration live. Camera scanning online.";
        }, 1500);

            e.preventDefault();
